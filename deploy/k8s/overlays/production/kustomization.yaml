apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../../base
images:
  - name: pulse
    newName: 355119163695.dkr.ecr.us-east-1.amazonaws.com/pulse
    newTag: set-by-deploy-script
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
