# Deploy workflow allowing multiple environments (Staging and Production) to use it to deploy
name: deploy

on:
  # Create reusable workflows for other workflows
  workflow_call:
    # All inputs must be provided under "with" for relevant jobs
    inputs:
      # Staging or Production
      environment:
        required: true
        type: string
      # Image being used
      image:
        required: true
        type: string

# Environment Variable
env:
  ACCOUNT_ID: 355119163695

# Allow to read code and request an OIDC token from Github
permissions:
  contents: read
  id-token: write

jobs:
  # Run on my laptop runner. The only machine to reach runner is kind cluster
  deploy:
    runs-on: [self-hosted, kind]
    # Links to the Github Environment
    environment: ${{ inputs.environment }}
    # One deploy at a time per environment. Subsequent waits instead of clashing
    concurrency: deploy-${{ inputs.environment }}

    steps:
      # Error out if image is empty. Check first to make sure an empty image isn't being deployed
      - name: Image must not be empty
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          if [[ -z "$IMAGE" ]]; then
            echo "::error::Image input is empty. Refusing to deploy"
            exit 1
          fi
          echo "Deploying $IMAGE"

      # Checkout the whole repo so deploy.sh can exist on the runner
      - name: Checkout
        # checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Swap Github OIDC token for temp AWS credentials of the pull role
      - name: Configure AWS credentials (pull role)
        # configure-aws-credentials v4.3.1
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          # IAM Role and region
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/github-actions-cicd-security-gates-ecr-pull-k8s
          aws-region: us-east-1

      # Blue-green deployment. Calls on the shell script to deploy using environment as namespace and the image we have been passing all the way from build
      - name: Blue-green deploy
        env:
          NAMESPACE: ${{ inputs.environment }}
          IMAGE: ${{ inputs.image }}
        run: bash deploy/deploy.sh "$NAMESPACE" "$IMAGE"
