name: pipeline

# Triggers starting the workflow
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      inject_failure:
        description: "Rollback test: staging's new colour fails /healthz 90 s after it starts"
        type: boolean
        default: false

# Environment variables
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cicd/cicdsecuritypipeline
  LOCAL_IMAGE: pulse:${{ github.sha }}
  ACCOUNT_ID: 355119163695
  IMAGE_TAG: ${{ github.sha }}

# Default permissions
permissions:
  contents: read

# Job for the linter
jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04

    steps:
      # Get the code
      - name: Checkout Code for linting
        # checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Set up Go on the runner to help run the lint
      - name: Set up Go for linting
        # setup-go v5.6.0
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache-dependency-path: ./go.mod

      # Check for any code formatting issues
      - name: gofmt formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following Go files are not properly formatted:"
            gofmt -l .
            echo "Run 'gofmt -w .' locally to fix them before pushing."
            exit 1
          else
            echo "All Go files are perfectly formatted!"
          fi

      # Run multiple linters simultaneously using golangci-lint
      - name: golangci-lint
        # golangci-lint-action v9.3.0
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: "v2.14.0"

      # Run hadolint to check Dockerfile best practices in the Dockerfile using hadolint
      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
        with:
          dockerfile: Dockerfile

  # Test job
  test:
    runs-on: ubuntu-26.04
    steps:
      # Gets the code for the test
      - name: checkout code for test
        # checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Sets up Go for the test
      - name: setup go test
        # setup-go v5.6.0
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache-dependency-path: ./go.mod

      # Install dependencies
      - name: go dependencies
        run: go mod download

      # Run Go test with Coverage
      - name: Go tests with Coverage
        run: go test -race -coverprofile=coverage.out ./...

      # 70% Coverage Gate
      - name: 70% Coverage Gate
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Current overall test coverage is: $COVERAGE%"

          # Check if coverage is less than 70%
          if (( $(echo "$COVERAGE < 70.0" | bc -l) )); then
            echo "Code coverage is below the minimum required 70% "
            exit 1
          fi
          echo "Code coverage passed the 70% gate."

  # Static Application Security Testing
  sast:
    runs-on: ubuntu-26.04
    # Get semgrep from an image
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout Code
        # checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Get high severities
      - name: Look for High Severities Only and Fail
        run: semgrep scan --config="p/golang" --severity="ERROR" --error

  # Checks for Go vulnerabilities within the code
  deps:
    runs-on: ubuntu-26.04
    steps:
      # Checks for Go vulnerabilities
      - name: govulcheck
        # govulncheck-action v1.1.0
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f
        with:
          cache-dependency-path: ./go.mod

  # Build, Scan, Tag and Push the Image to ECR
  build:
    # Need to include a write permission to get Github ID card
    permissions:
      contents: read
      id-token: write
    # All tests must pass before build runs
    needs: [lint, test, sast, deps]
    runs-on: ubuntu-26.04

    # Artifact for later (Repo Digest for the image when pushed to ECR)
    outputs:
      # All_Steps.ID.input_or_output.key_value_of_output
      image: ${{ steps.push.outputs.image }}

    steps:
      - name: Checkout Code
        # checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Build Docker Image
      - name: Build docker image
        id: build-c
        run: |
          docker build \
            --build-arg GIT_SHA="$IMAGE_TAG" \
            -t "$LOCAL_IMAGE" \
            .
      # Scan the Image using Trivy
      - name: Trivy Scan
        # trivy-action v0.35.0
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: "${{ env.LOCAL_IMAGE }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true # Ignore unfixed CVEs
          severity: "CRITICAL"

      # Authenticate with AWS using OIDC
      - name: Configure AWS Credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        # configure-aws-credentials v4.3.1
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/github-actions-cicd-security-gates-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      # Log in to ECR
      - name: Log In to ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: login-ecr
        # amazon-ecr-login v2.1.7
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd

      # Tag the Image and Push to ECR
      - name: Tag and push to ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: push
        env:
          REMOTE_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
        run: |
          docker tag "$LOCAL_IMAGE" "$REMOTE_IMAGE"
          docker push "$REMOTE_IMAGE"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$REMOTE_IMAGE")
          echo "Pushed: $DIGEST"
          echo "image=$DIGEST" >> "$GITHUB_OUTPUT"

  staging:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.build.outputs.image }}
      inject_failure: ${{ inputs.inject_failure == true }}

  production:
    needs: [build, staging]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.build.outputs.image }}

  notify:
    needs: [lint, test, sast, deps, build, staging, production]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Write pipeline summary
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          SAST: ${{ needs.sast.result }}
          DEPS: ${{ needs.deps.result }}
          BUILD: ${{ needs.build.result }}
          STAGING: ${{ needs.staging.result }}
          PRODUCTION: ${{ needs.production.result }}
          IMAGE: ${{ needs.build.outputs.image }}
          INJECT_FAILURE: ${{ inputs.inject_failure == true }}
        run: |
          icon() {
            case "$1" in
              success) echo "Success" ;;
              failure) echo "Failure" ;;
              cancelled) echo "Cancelled" ;;
              *) echo "$1" ;;
            esac
          }
          {
            echo "## Pipeline result"
            echo ""
            echo "Trigger: \`$EVENT\` · Commit: \`${SHA:0:7}\` · Rollback test: \`$INJECT_FAILURE\`"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| lint | $(icon "$LINT") |"
            echo "| test | $(icon "$TEST") |"
            echo "| sast | $(icon "$SAST") |"
            echo "| deps | $(icon "$DEPS") |"
            echo "| build | $(icon "$BUILD") |"
            echo "| staging | $(icon "$STAGING") |"
            echo "| production | $(icon "$PRODUCTION") |"
            echo ""
            echo "Image: \`${IMAGE:-not pushed}\`"
          } >> "$GITHUB_STEP_SUMMARY"
